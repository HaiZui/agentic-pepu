[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bottle_throne"
version = "0.1.0"
description = "The Bottle Throne - a visual novel raffle for the Friday bottle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bottle_throne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
