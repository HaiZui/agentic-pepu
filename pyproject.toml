[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bottle_throne"
version = "0.1.0"
description = "The Bottle Throne - a visual novel raffle for the Friday bottle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "openai>=2.0",
    # Prints the comic book PDF; also run `python -m playwright install chromium` once.
    "playwright>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "pypdf>=6.0",
]
# Only needed to regenerate the bundled audio (scripts/gen_audio_assets.py).
assets = [
    "numpy>=2.0",
    "soundfile>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bottle_throne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
